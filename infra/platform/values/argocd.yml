configs:
  params:
    server.insecure: true          # because: Traefik terminates TLS; stops argocd-server's double-TLS redirect loop

server:
  ingress:
    enabled: true                  # because: chart owns its own Ingress; no separate manifest to drift
    ingressClassName: traefik      # because: k3s bundles Traefik as default controller
    hostname: argocd.localhost     # *.localhost auto-resolves to 127.0.0.1 in browsers (no /etc/hosts); avoids .local mDNS
