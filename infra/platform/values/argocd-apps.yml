applications:
  root:
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/melvillewong/k8s-gitops-platform.git
      path: argocd
      targetRevision: HEAD
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      automated: { prune: true, selfHeal: true }
