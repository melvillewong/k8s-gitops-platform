alloy:
  mounts:
    varlog: true               # because: pod logs live in the node's /var/log/pods; hostPath mount, read-only
  configMap:
    content: |
      // Find pods on this node only; HOSTNAME = spec.nodeName (set by the chart), so each DaemonSet pod tails its own node
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Keep only the labels that match Prometheus (namespace, pod, container) plus app; everything else is dropped
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // app: chart-style label first, then plain `app` (Garage) overrides it when set
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "app"
        }
        // file path: /var/log/pods/<ns>_<pod>_<uid>/<container>/<n>.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // containerd writes "<time> stdout F <line>"; cri parses it, keeps the real timestamp and the bare line
        stage.cri {}
        // filename is one value per log file and rotation; pod + container already identify the stream
        stage.label_drop {
          values = ["filename"]
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc:3100/loki/api/v1/push"
        }
      }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }  # because: OOMKill the collector, not starve the node

serviceMonitor:
  enabled: true                # because: Prometheus scrapes Alloy, so "collector up on every node" is a metric, not a guess
