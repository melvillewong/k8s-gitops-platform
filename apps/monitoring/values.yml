# because: k3s embeds these in its server binary, listening on localhost only; scrapes fail and fire false TargetDown alerts
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

alertmanager:
  alertmanagerSpec:
    podMetadata:
      annotations:                    # because: operator builds the pod; this is where pod annotations go
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: alertmanager
        vault.hashicorp.com/agent-pre-populate-only: "true"   # because: Alertmanager reads the file at send time; the webhook rarely changes
        vault.hashicorp.com/agent-inject-secret-discord: secret/data/notify/discord
        vault.hashicorp.com/agent-inject-template-discord: |
          {{- with secret "secret/data/notify/discord" -}}
          {{ .Data.data.webhook_url }}
          {{- end }}
  config:
    route:
      receiver: "null"                # because: default sink; only matched routes notify
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h             # because: a still-firing critical reminds every 4h, not every 12h (chart default)
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']   # because: always firing by design; would spam Discord
        - receiver: discord
          matchers: ['severity = "critical"']    # because: only page on critical; 93 warning rules would be noise
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /vault/secrets/discord   # because: URL stays in Vault, never in Git or a k8s Secret
            send_resolved: true                        # because: "fixed" message closes the loop and times recovery
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            message: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}

prometheus:
  prometheusSpec:
    retention: 7d             # because: a week covers homelab debugging; default 10d costs disk for nothing
    retentionSize: 4GB        # because: hard cap below the 5Gi PVC, so a cardinality blow-up cannot fill the volume
    serviceMonitorSelectorNilUsesHelmValues: false  # because: one Prometheus; pick every ServiceMonitor (no release-label trap)
    podMonitorSelectorNilUsesHelmValues: false      # because: same trap for PodMonitor
    ruleSelectorNilUsesHelmValues: false            # because: same trap for our PrometheusRule
    storageSpec:              # because: the default is emptyDir, so all metrics are lost on pod restart
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 5Gi } }
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1536Mi }   # because: OOMKill Prometheus, not starve the box (15 GB shared with Vault, Loki, ArgoCD)

grafana:
  ingress:                    # because: same *.localhost + Traefik pattern as ArgoCD and Forgejo, no port-forward
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.localhost]
  env:
    GF_SECURITY_ADMIN_USER: admin   # because: with the password from Vault the chart stops creating its admin Secret, but still reads the user from it
    GF_SECURITY_ADMIN_PASSWORD: $__file{/vault/secrets/grafana}  # because: distroless image has no /run.sh for __FILE; Grafana expands $__file itself
  podAnnotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: grafana
    vault.hashicorp.com/agent-pre-populate-only: "true" # because: Grafana reads the password only at start; no sidecar needed
    vault.hashicorp.com/agent-inject-secret-grafana: secret/data/grafana/admin
    vault.hashicorp.com/agent-inject-template-grafana: |
      {{- with secret "secret/data/grafana/admin" -}}
      {{ .Data.data.password }}
      {{- end }}
  sidecar:
    dashboards:
      skipReload: true        # because: the reload API needs the admin password, which only Grafana sees; Grafana re-reads dashboard files every 30s anyway
    datasources:
      skipReload: true        # because: same reason; no reload call
      initDatasources: true   # because: without a reload call, datasources must be on disk before Grafana starts
      watchMethod: LIST       # because: the init container reuses this; WATCH never exits, so the pod stays at Init:0/2
