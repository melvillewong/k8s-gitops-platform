apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-dashboard
  labels:
    grafana_dashboard: "1"       # because: the Grafana sidecar loads ConfigMaps with this label, from any namespace
data:
  garage.json: |                 # because: Grafana has no persistence; a UI-only dashboard dies with the pod
    {
      "uid": "garage",
      "title": "Garage",
      "schemaVersion": 41,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "S3 request rate",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (api_endpoint) (rate(api_s3_request_counter[5m]))", "legendFormat": "{{api_endpoint}}" }
          ]
        },
        {
          "id": 2, "type": "timeseries", "title": "Garage up",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "min": 0, "max": 1,
              "links": [
                {
                  "title": "Logs for ${__field.labels.pod} (Loki)",
                  "targetBlank": true,
                  "url": "/explore?schemaVersion=1&panes={\"a\":{\"datasource\":\"loki\",\"queries\":[{\"refId\":\"A\",\"datasource\":{\"type\":\"loki\",\"uid\":\"loki\"},\"expr\":\"{namespace=`${__field.labels.namespace}`, pod=`${__field.labels.pod}`}\"}],\"range\":{\"from\":\"${__from}\",\"to\":\"${__to}\"}}}"
                }
              ]
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "expr": "up{job=\"garage\"}", "legendFormat": "garage" }
          ]
        },
        {
          "id": 3, "type": "logs", "title": "Garage logs",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "loki" }, "expr": "{namespace=\"storage\", app=\"garage\"}" }
          ]
        }
      ]
    }
