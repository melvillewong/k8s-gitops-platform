# PreSync: create Secret garage-rpc once, before the StatefulSet starts. Never rotates (Garage nodes must share one value).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-rpc-init
  annotations:
    argocd.argoproj.io/hook: PreSync                      # because: normal resources apply after PreSync; the Job's SA must exist first
    argocd.argoproj.io/sync-wave: "-1"                    # because: SA + RBAC before the Job, within PreSync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-rpc-init
  annotations: { argocd.argoproj.io/hook: PreSync, argocd.argoproj.io/sync-wave: "-1" }
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [garage-rpc]        # because: least privilege; read this Secret only
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]                    # create cannot be limited by resourceNames (name unknown before it exists)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-rpc-init
  annotations: { argocd.argoproj.io/hook: PreSync, argocd.argoproj.io/sync-wave: "-1" }
subjects:
  - { kind: ServiceAccount, name: garage-rpc-init }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: garage-rpc-init }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-rpc-init
  annotations:
    argocd.argoproj.io/hook: PreSync                          # because: the StatefulSet needs the Secret before it can start
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation # because: keep the last run's logs
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      serviceAccountName: garage-rpc-init
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: init
          image: alpine/kubectl:1.36.2   # because: same image as garage-init (kubectl + sh + od)
          env: [{ name: HOME, value: /tmp }]
          securityContext: { allowPrivilegeEscalation: false }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          command: [sh, -c]
          args:
            - |
              set -eu
              # because: an existing value must never change; Garage would split from its own data
              if kubectl -n storage get secret garage-rpc > /dev/null 2>&1; then
                echo "garage-rpc exists"; exit 0
              fi
              # 32 random bytes as 64 hex chars (Garage's format); value never printed
              kubectl -n storage create secret generic garage-rpc \
                --from-literal=rpc-secret="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" > /dev/null
              echo "garage-rpc created"
