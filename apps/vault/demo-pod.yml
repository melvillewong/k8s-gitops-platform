# Verify only: applied by hand (`kubectl apply -f`), not synced by ArgoCD. Delete after Verify.
apiVersion: v1
kind: Namespace
metadata:
  name: vault-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo
  namespace: vault-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: demo
  namespace: vault-demo
  labels:
    vault-inject: "true" # because: matches the injector webhook's objectSelector (opt-in)
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: demo # Vault role bound to SA demo in vault-demo
    vault.hashicorp.com/agent-pre-populate-only: "true" # because: init container only, no long-running sidecar for a one-shot demo
    vault.hashicorp.com/agent-inject-secret-loki-s3: secret/data/garage/loki-key
    vault.hashicorp.com/agent-inject-template-loki-s3: |
      {{- with secret "secret/data/garage/loki-key" -}}
      access_key_id={{ .Data.data.access_key_id }}
      secret_access_key={{ .Data.data.secret_access_key }}
      {{- end }}
spec:
  serviceAccountName: demo
  containers:
    - name: demo
      image: busybox:1.37
      command: ["sleep", "3600"]
