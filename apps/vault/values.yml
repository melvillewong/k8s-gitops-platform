# Overlay on hashicorp/vault 0.34.1 defaults (full dump: `helm show values hashicorp/vault --version 0.34.1`, not committed).
# Only apps/vault/values.yml is read by ArgoCD; policies/ are loaded by scripts/vault-bootstrap.sh.
server:
  standalone:
    enabled: true # because: single node, file storage on a PVC, secrets survive restarts (dev mode is in-memory)
  dataStorage:
    size: 1Gi # because: KV secrets are tiny; default 10Gi wastes local-path disk
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi } # because: box RAM is shared with the observability stack
  statefulSet:
    securityContext:
      # setting container replaces the chart default, so allowPrivilegeEscalation is repeated
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true # because: an attacker in the pod cannot drop tools onto the image filesystem
  # because: the chart's start command writes its config to /tmp; /home/vault is already an emptyDir from the chart
  volumes:
    - { name: tmp, emptyDir: {} }
  volumeMounts:
    - { name: tmp, mountPath: /tmp }

injector:
  securityContext:
    # setting container replaces the chart default, so its two settings are repeated
    container:
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }
      readOnlyRootFilesystem: true # because: the injector keeps its webhook certificate in memory, no file writes
  enabled: true # because: agent sidecar renders secrets into pods by ServiceAccount identity (default "-" follows global.enabled; explicit here)
  webhook:
    failurePolicy: Fail # because: fail closed; a pod needing a secret is rejected and retried, never started without it (Ignore let Grafana start bare after a reboot)
    objectSelector: | # because: opt-in label; a down injector blocks only these pods, not every pod in the cluster
      matchLabels:
        vault-inject: "true"
