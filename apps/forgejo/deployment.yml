apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
spec:
  replicas: 1                    # RWO PVC + SQLite: one writer only
  selector:
    matchLabels: { app: forgejo }
  template:
    metadata:
      labels: { app: forgejo }
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15.0.5   # pin a real tag
          ports:
            - containerPort: 3000   # web
            - containerPort: 22     # ssh git (optional now)
          volumeMounts:
            - name: data
              mountPath: /data       # Forgejo state lives here
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
