apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: default   # built-in wide-open project; single tenant so no repo/namespace restrictions needed yet
  source:
    repoURL: https://github.com/melvillewong/k8s-devops-platform.git
    path: apps/forgejo
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo         # where the workload lands
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
