apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd            # Application lives in argocd ns
spec:
  project: default  # (unsure how this help)
  source:
    repoURL: https://github.com/melvillewong/k8s-devops-platform.git # (can this ref to specific dir)
    path: apps/forgejo         # <- the dir Argo watches (unsure the relative path)
    targetRevision: HEAD
  destination:  # (unsure what these for)
    server: https://kubernetes.default.svc
    namespace: forgejo         # where the workload lands
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
