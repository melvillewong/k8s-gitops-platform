apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
spec:
  project: default
  source:
    # because: chart is published to an OCI registry; Argo takes the registry path without oci://
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.15.0
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # because: ARC CRDs exceed the 256 KiB last-applied annotation limit of client-side apply
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
