name: pr-validate

on:
  pull_request:
    branches: [main]

# because: checks only read the repo; no id-token (Vault login is a separate workflow), no write
permissions:
  contents: read

jobs:
  terraform:
    runs-on: arc-runner-set # because: must match runnerScaleSetName in apps/arc/values.yml
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.7 # same pin as .mise.toml
          # because: the default wrapper is a Node script and the ARC runner image has no node on PATH
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -diff -recursive infra
      - name: validate
        # because: -backend=false needs no state and no cluster; only providers are downloaded
        run: |
          for root in infra/cluster infra/platform; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  manifests:
    runs-on: arc-runner-set
    env:
      KUBECONFORM_VERSION: v0.8.0
      # because: kubeconform only ships built-in k8s schemas; CRDs (Argo Application, ARC) come from the community catalogue
      # pinned to a commit, not main: same schema bytes every run; bump by hand after an ArgoCD/ARC upgrade
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3 # same pin as .mise.toml
      - name: install kubeconform
        # because: the runner user has no root (sudo blocked in apps/arc/values.yml); the per-job temp dir needs none
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: kubeconform (plain manifests + Applications)
        # because: values.yml and *.hcl under apps/ are not k8s objects, so paths are listed explicitly
        run: |
          kubeconform -strict -summary \
            -schema-location default -schema-location "$CRD_SCHEMAS" \
            apps/forgejo apps/garage argocd
      - name: helm template (vault)
        # chart version must match targetRevision in argocd/vault-app.yml
        # because: tee keeps a copy of each render for the trivy job
        run: |
          mkdir -p "$RUNNER_TEMP/render"
          helm template vault vault --repo https://helm.releases.hashicorp.com \
            --version 0.34.1 -n vault -f apps/vault/values.yml \
            | tee "$RUNNER_TEMP/render/vault.yml" \
            | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -
      - name: helm template (loki)
        # chart version must match targetRevision in argocd/loki-app.yml
        run: |
          helm template loki loki --repo https://grafana.github.io/helm-charts \
            --version 7.3.0 -n logging -f apps/loki/values.yml \
            | tee "$RUNNER_TEMP/render/loki.yml" \
            | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -
      - name: helm template (arc-runners)
        # because: helm prints "Pulled:" lines to stdout for OCI charts, which would corrupt the pipe; pull first
        # chart version must match targetRevision in argocd/arc-runners-app.yml
        run: |
          helm pull oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
            --version 0.15.0 -d "$RUNNER_TEMP"
          helm template arc-runners "$RUNNER_TEMP/gha-runner-scale-set-0.15.0.tgz" \
            -n arc-runners -f apps/arc/values.yml \
            | tee "$RUNNER_TEMP/render/arc-runners.yml" \
            | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -
      - uses: actions/upload-artifact@v7
        with:
          name: rendered-charts
          path: ${{ runner.temp }}/render
          retention-days: 1 # because: only the trivy job in this run reads it

  trivy:
    runs-on: arc-runner-set
    needs: manifests # because: scans the charts manifests already rendered, so chart versions live in one place
    env:
      TRIVY_VERSION: 0.76.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rendered-charts
          path: ${{ runner.temp }}/render
      - name: install trivy
        # because: no root on the runner (same as kubeconform); checksum checked so a swapped tarball fails
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSLO "$base/$tarball" -O "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $tarball\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
      - name: cache key
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        # because: the vuln DB and checks bundle are re-downloaded every run otherwise; one key per day
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-${{ steps.date.outputs.today }}
          restore-keys: trivy-
      - name: config scan (blocking)
        # because: scan all three before failing, so one red run shows every finding
        run: |
          rc=0
          for target in infra apps "$RUNNER_TEMP/render"; do
            echo "== $target"
            trivy config --severity HIGH,CRITICAL --exit-code 1 "$target" || rc=1
          done
          exit "$rc"
      - name: image scan (report only)
        # because: upstream images, no rebuild path; fixed by a chart or tag bump
        if: always()
        run: |
          grep -rhoE 'image: *"?[^" ]+' apps "$RUNNER_TEMP/render" \
            | sed -E 's/image: *"?//' | sort -u > "$RUNNER_TEMP/images.txt"
          cat "$RUNNER_TEMP/images.txt"
          while read -r img; do
            echo "== $img"
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 "$img"
          done < "$RUNNER_TEMP/images.txt"
